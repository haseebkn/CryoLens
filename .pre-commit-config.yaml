# Pre-commit hooks mirroring the CI gates in .github/workflows/ci.yml.
# Install once with:  pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      # Datasets and model weights must never enter the repository.
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^(src|tests)/
        additional_dependencies:
          - types-PyYAML
          - types-requests
        # Third-party geospatial stubs are handled by the overrides in
        # pyproject.toml; keep the hook consistent with `make lint`.
        args: [--config-file=pyproject.toml]
