name: CI

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, types, unit tests and PostGIS
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cryolens_test
          POSTGRES_USER: cryolens_test
          POSTGRES_PASSWORD: ci-local-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cryolens_test -d cryolens_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.19'
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Lint and formatting
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Type check
        run: uv run --frozen mypy src tests
      - name: Unit and portable integration tests
        run: uv run --frozen pytest --cov=src/cryolens --cov-report=term-missing
      - name: Migrate and verify real PostGIS
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: cryolens_test
          POSTGRES_USER: cryolens_test
          POSTGRES_PASSWORD: ci-local-test-password
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen python scripts/check_postgis.py
      - name: Build distribution
        run: |
          uv build
          uv run --frozen python scripts/check_wheel.py dist/cryolens-0.1.0-py3-none-any.whl
