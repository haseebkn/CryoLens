[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryolens"
version = "0.1.0"
description = "Autonomous SAR iceberg detection, validation, and drift forecasting for the Grand Banks & NE Newfoundland shelf."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "CryoLens Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rasterio>=1.3.9",
    "geopandas>=0.14.3",
    "pyproj>=3.6.1",
    "shapely>=2.0.3",
    "pystac-client>=0.7.6",
    "asf-search>=7.0.0",
    "planetary-computer>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "geojson-pydantic>=1.0.2",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.1.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.11.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12.20240311",
    "types-requests>=2.31.0.20240406",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cryolens"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["cryolens"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "rasterio.*",
    "geopandas.*",
    "pyproj.*",
    "shapely.*",
    "asf_search.*",
    "planetary_computer.*",
    "pystac_client.*",
    "scipy.*",
    "ultralytics.*",
    "opendrift.*",
    "copernicusmarine.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
